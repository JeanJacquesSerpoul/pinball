name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: index.html à jour avec les sources
        run: npm run check
      - name: Tests de la physique et des règles
        run: npm test
